<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>主页 · 新齐客户关系管理 APP</title>
  <style>
    /* 模拟手机 APP 主页：整体限宽 480px，水平居中，垂直占满视口 */
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #f8f9fa; /* bootstrap light，手机框外的底色 */
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .app-phone {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: #fff; /* 页面底色白色 */
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 1.5rem rgba(0, 0, 0, 0.08);
    }

    /* 顶部蓝色导航标题栏 */
    .app-navbar {
      background-color: #0d6efd; /* bootstrap primary */
      color: #fff;
      display: grid;
      grid-template-columns: 3rem 1fr 3rem;
      align-items: center;
      padding: 0.75rem 1rem;
    }
    .app-navbar .nav-title {
      grid-column: 2;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
    }
    .avatar-btn {
      grid-column: 1;
      width: 2.2rem;
      height: 2.2rem;
      border: 0;
      background: transparent;
      color: #fff;
      padding: 0;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
    }
    .avatar-btn i {
      font-size: 1.9rem;
    }

    /* 功能网格 */
    .app-body {
      flex: 1 0 auto;
      padding: 1rem;
    }
    .feature-tile {
      background-color: #0d6efd; /* bootstrap primary */
      color: #fff;
      border: 0;
      border-radius: 0.6rem;
      aspect-ratio: 1 / 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.5rem;
      text-decoration: none;
    }
    .feature-tile i {
      font-size: 1.8rem;
      color: #fff;
    }
    .feature-tile .tile-text {
      font-size: 0.8rem;
      color: #fff;
      text-align: center;
      line-height: 1.2;
    }
    .feature-placeholder {
      background-color: #0d6efd;
      border-radius: 0.6rem;
      aspect-ratio: 1 / 1;
      width: 100%;
    }
  </style>
</head>
<body>
  <main class="app-phone">
    <!-- 顶部导航标题栏 -->
    <header class="app-navbar">
      <a href="/pages/user/index.html" class="avatar-btn" aria-label="用户中心">
        <i class="bi bi-person-circle"></i>
      </a>
      <div class="nav-title">主页</div>
    </header>

    <!-- 主体功能网格：3 列 × 3 行 = 7 个功能方块 + 2 个空白占位方块 -->
    <div class="app-body">
      <div class="row g-3">
        <!-- 第 1 行 -->
        <div class="col-4">
          <div class="feature-tile">
            <i class="bi bi-diagram-2"></i>
            <span class="tile-text">客户来源管理</span>
          </div>
        </div>
        <div class="col-4">
          <div class="feature-tile">
            <i class="bi bi-tags"></i>
            <span class="tile-text">客户类别管理</span>
          </div>
        </div>
        <div class="col-4">
          <div class="feature-tile">
            <i class="bi bi-person-lines-fill"></i>
            <span class="tile-text">客户信息管理</span>
          </div>
        </div>

        <!-- 第 2 行 -->
        <div class="col-4">
          <div class="feature-tile">
            <i class="bi bi-star"></i>
            <span class="tile-text">信用等级管理</span>
          </div>
        </div>
        <div class="col-4">
          <div class="feature-tile">
            <i class="bi bi-shield-check"></i>
            <span class="tile-text">客户信用管理</span>
          </div>
        </div>
        <div class="col-4">
          <div class="feature-placeholder"></div>
        </div>

        <!-- 第 3 行 -->
        <div class="col-4">
          <div class="feature-tile">
            <i class="bi bi-geo-alt"></i>
            <span class="tile-text">客户追踪管理</span>
          </div>
        </div>
        <div class="col-4">
          <div class="feature-tile">
            <i class="bi bi-bag-check"></i>
            <span class="tile-text">客户订单管理</span>
          </div>
        </div>
        <div class="col-4">
          <div class="feature-placeholder"></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
