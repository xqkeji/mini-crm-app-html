<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>修改密码 · 新齐客户关系管理 APP</title>
  <style>
    /* 模拟手机 APP 修改密码页：限宽 480px，占满可视高度，整体居中 */
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #f8f9fa; /* 手机框外底色 */
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .app-phone {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: #fff; /* 页面白底 */
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 1.5rem rgba(0, 0, 0, 0.08);
    }

    /* 顶部 primary 标题栏 */
    .app-navbar {
      background-color: #0d6efd; /* bootstrap primary */
      color: #fff;
      display: grid;
      grid-template-columns: 3rem 1fr 3rem;
      align-items: center;
      padding: 0.75rem 1rem;
    }
    .back-btn {
      grid-column: 1;
      border: 0;
      background: transparent;
      color: #fff;
      padding: 0;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      text-decoration: none;
    }
    .back-btn i {
      font-size: 1.5rem;
    }
    .app-navbar .nav-title {
      grid-column: 2;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
    }

    /* 内容区：统一内边距容器 */
    .pwd-body {
      padding: 1.25rem;
    }
  </style>
</head>
<body>
  <main class="app-phone">
    <!-- 顶部标题栏 -->
    <header class="app-navbar">
      <a href="/pages/user/index.html" class="back-btn" aria-label="返回用户中心">
        <i class="bi bi-arrow-left"></i>
      </a>
      <div class="nav-title">修改密码</div>
    </header>

    <!-- 表单内容区 -->
    <div class="pwd-body">
      <form>
        <div class="mb-3">
          <label for="oldPwd" class="form-label">原登录密码</label>
          <input type="password" class="form-control" id="oldPwd" name="oldPwd" placeholder="请输入原登录密码" />
        </div>
        <div class="mb-3">
          <label for="newPwd" class="form-label">新登录密码</label>
          <input type="password" class="form-control" id="newPwd" name="newPwd" placeholder="请输入新登录密码" />
        </div>
        <div class="mb-4">
          <label for="confirmPwd" class="form-label">确认密码</label>
          <input type="password" class="form-control" id="confirmPwd" name="confirmPwd" placeholder="请再次输入新登录密码" />
        </div>
        <button type="button" class="btn btn-primary w-100 py-2">确认</button>
      </form>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
