<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户中心 · 新齐客户关系管理 APP</title>
  <style>
    /* 模拟手机 APP 用户中心：限宽 480px，占满可视高度，整体居中 */
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #f8f9fa; /* 手机框外底色 */
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .app-phone {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: #fff; /* 页面背景白色 */
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 1.5rem rgba(0, 0, 0, 0.08);
    }

    /* 顶部 primary 标题栏 */
    .app-navbar {
      background-color: #0d6efd; /* bootstrap primary */
      color: #fff;
      display: grid;
      grid-template-columns: 3rem 1fr 3rem;
      align-items: center;
      padding: 0.75rem 1rem;
    }
    .back-btn {
      grid-column: 1;
      border: 0;
      background: transparent;
      color: #fff;
      padding: 0;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      text-decoration: none;
    }
    .back-btn i {
      font-size: 1.5rem;
    }
    .app-navbar .nav-title {
      grid-column: 2;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
    }

    /* 统一内容容器：让信息行与两个按钮宽度一致 */
    .user-body {
      padding: 1.25rem;
      display: grid;
      gap: 0.75rem;
    }

    /* 用户信息行 */
    .user-row {
      background-color: #f8f9fa; /* bootstrap light */
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
    }
    .user-row .user-avatar {
      font-size: 2rem;
      color: #0d6efd;
    }
    .user-row .user-name {
      font-size: 1.05rem;
      color: #212529;
    }
  </style>
</head>
<body>
  <main class="app-phone">
    <!-- 顶部标题栏 -->
    <header class="app-navbar">
      <a href="/pages/home/index.html" class="back-btn" aria-label="返回主页">
        <i class="bi bi-arrow-left"></i>
      </a>
      <div class="nav-title">用户中心</div>
    </header>

    <!-- 内容区：信息行 + 两个通栏按钮，宽度一致 -->
    <div class="user-body">
      <div class="user-row">
        <i class="bi bi-person-fill user-avatar"></i>
        <span class="user-name">xqkeji</span>
      </div>
      <a href="/pages/password/index.html" class="btn btn-primary w-100 py-2">修改密码</a>
      <button type="button" class="btn btn-warning w-100 py-2">注销账号</button>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
